<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Сводка — отчёт по смене из iiko</title>
<meta name="description" content="Выручка, чеки, официанты, скидки и удаления — отчёт собственнику после каждой смены из iiko.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0907">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/fonts/fonts.css">
<!-- От корня: ссылка из Telegram открывает /app/r/:id. Относительный src искался бы в /app/r/ и получал эту же HTML-страницу. -->
<link rel="stylesheet" href="/app/app.css?v=22">
<link rel="stylesheet" href="/app/trio-skin.css?v=22">
</head>
<body>
<div id="app"><div class="loading" role="status"><span class="spinner" aria-hidden="true"></span>Загружаю…</div></div>
<noscript><p style="padding:24px">Для работы «Сводки» включите JavaScript.</p></noscript>
<script>
(function () {
  var shown = false;
  function bootError(msg) {
    var app = document.getElementById("app");
    if (!app || app.getAttribute("data-booted") === "1" || shown) return;
    shown = true;
    document.documentElement.style.background = "#100E1C";
    document.body.style.margin = "0";
    document.body.style.minHeight = "100vh";
    document.body.style.background = "#100E1C";
    app.textContent = "";
    app.setAttribute("role", "alert");
    var box = document.createElement("main");
    box.style.cssText = "max-width:28rem;margin:0;padding:28px 20px;color:#ECEAF5;font:16px/1.45 system-ui,sans-serif";
    var title = document.createElement("h1");
    title.textContent = "Отчёт не открылся";
    title.style.cssText = "font-size:1.35rem;margin:0 0 8px";
    var text = document.createElement("p");
    text.textContent = msg || "Не удалось загрузить кабинет. Проверьте интернет и попробуйте ещё раз.";
    text.style.cssText = "margin:0 0 16px;color:#ABA6C2";
    var button = document.createElement("button");
    button.type = "button";
    button.textContent = "Повторить";
    button.style.cssText = "font:600 1rem system-ui,sans-serif;min-height:44px;padding:12px 18px;border-radius:8px;border:0;background:#ECEAF5;color:#100E1C;cursor:pointer";
    button.addEventListener("click", function () { location.reload(); });
    box.appendChild(title);
    box.appendChild(text);
    box.appendChild(button);
    app.appendChild(box);
  }
  window.__svBootError = bootError;
  window.addEventListener("error", function (e) {
    var t = e.target;
    if (t && t.tagName === "SCRIPT") bootError("Не удалось загрузить кабинет. Проверьте интернет и попробуйте ещё раз.");
  }, true);
  setTimeout(function () {
    var app = document.getElementById("app");
    if (!window.SV || !app || app.getAttribute("data-booted") !== "1") bootError("Страница слишком долго открывается. Проверьте интернет и попробуйте ещё раз.");
  }, 15000);
})();
</script>
<script src="/app/core.js?v=23"></script>
<script src="/app/app.js?v=23"></script>
<script src="/app/team.js?v=22"></script>
<script src="/app/trio-bill.js?v=24" data-product="sv" data-store="sv_owner" data-field="token" data-owner="^/(home|connect|settings|agents|expenses|r/)" data-name="Сводка"></script>
<script src="/app/guide.js?v=22" data-product="sv" data-store="sv_owner" data-field="token"></script>
<script>
try {
  if (!window.SV) window.__svBootError("Кабинет не загрузился. Обновите страницу.");
  else window.SV.dispatch();
} catch (e) {
  if (window.SV && SV.fatal) SV.fatal(e);
  else if (window.__svBootError) window.__svBootError(e && e.message);
}
</script>
</body>
</html>
